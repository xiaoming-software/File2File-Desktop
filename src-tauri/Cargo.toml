[package]
name = "file2file-tauri"
version = "0.1.0"
description = "File2File desktop (Tauri)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
drag = "2.1"
xcap = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
cpal = "0.15"
base64 = "0.22"
aec3 = "0.3"
openh264 = { version = "0.8.1", features = ["source"] }
enigo = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
core-graphics = { version = "0.24", features = ["highsierra"] }
screencapturekit = "=0.3.5"
core-media-rs = "0.3"
core-video-rs = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
