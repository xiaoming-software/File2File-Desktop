[[permission]]
identifier = "allow-webrpc"
description = "Allow webrpc login, logout, open, send and close session"
commands.allow = [
  "webrpc_login",
  "webrpc_logout",
  "webrpc_open_session",
  "webrpc_send_data",
  "webrpc_send_file",
  "webrpc_close_session",
  "nas_watch_start",
  "nas_watch_stop",
  "nas_list_path",
  "nas_create_entry",
  "nas_move_entry",
  "nas_delete_entry",
  "nas_rename_entry",
  "nas_search",
  "nas_zip_entry",
  "nas_get_file",
  "nas_read_text",
  "nas_write_text",
  "nas_put_file",
  "nas_task_list",
  "nas_task_bind",
  "nas_task_upload",
  "nas_task_upload_many",
  "nas_task_download",
  "nas_start_drag_out",
  "nas_task_retry",
  "nas_task_delete",
  "nas_task_clear",
  "nas_task_wipe",
  "voice_invite",
  "voice_accept",
  "voice_reject",
  "voice_hangup",
  "voice_set_mute",
  "voice_state",
  "desktop_invite",
  "desktop_accept",
  "desktop_reject",
  "desktop_hangup",
  "desktop_share_start",
  "desktop_share_stop",
  "desktop_state",
  "desktop_input",
]
